# Production URL of the site.
# TODO: replace with your real domain before deploying to Cloudflare Pages,
# e.g. baseURL = "https://blog.samratghale.com/"
baseURL = "https://example.com/"

theme = "whiteplain"

# Site metadata.
title = "Samrat Ghale"
copyright = "&copy; Copyright 2026, Samrat Ghale"
locale = "en-US"
defaultContentLanguage = "en"

enableRobotsTXT = true

[permalinks]
  blog = "/blog/:slug/"
  gameengine = "/gameengine/:slug/"

# Whiteplain uses these three taxonomies. `series` powers the series box on
# posts and the /series/ pages.
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[params]
  description = "Notes on game engines, graphics programming, and software."

  # Optional: add static/favicon.ico and uncomment.
  # favicon = "favicon.ico"

  # Optional: add an image (e.g. static/images/share.png) and uncomment.
  # logo = "images/share.png"

  # Load Font Awesome from its CDN instead of the bundled copy.
  # useCDN = true

  # Date format. Defaults to "January 2, 2006".
  # dateFormat = "2006-01-02"

# Displayed on the About page.
[params.author]
  name = "Samrat Ghale"
  github = "SamratGhale"

# Header navigation.
[[menu.main]]
  name = "Game Engine"
  identifier = "gameengine"
  url = "/gameengine/"
  weight = 1

[[menu.main]]
  name = "Series"
  identifier = "series"
  url = "/series/"
  weight = 2

[[menu.main]]
  name = "Tags"
  identifier = "tags"
  url = "/tags/"
  weight = 3

[[menu.main]]
  name = "About"
  identifier = "about"
  url = "/about/"
  weight = 4

# Footer navigation.
[[menu.footer]]
  name = "About"
  identifier = "about"
  url = "/about/"
  weight = 1

# Configure syntax highlighting. Whiteplain ships a class-based monokai
# stylesheet (static/css/syntax.css), so emit classes instead of inline styles.
# See https://gohugo.io/configuration/markup/#highlight
[markup]
  [markup.highlight]
    noClasses = false
    style = 'monokai'
    lineNos = true
    lineNumbersInTable = false
    codeFences = true

# Keep processed images in the cache directory used by Cloudflare Workers.
# See https://gohugo.io/host-and-deploy/deploy-to-cloudflare/
[caches]
  [caches.images]
    dir = ':cacheDir/images'
