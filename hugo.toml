# Production URL of the site.
# TODO: replace with your real domain before deploying to Cloudflare.
baseURL = "https://example.com/"

theme = "paperesque"

# Site metadata.
title = "Samrat Ghale"
copyright = "© 2026 Samrat Ghale"
locale = "en-US"
defaultContentLanguage = "en"

enableRobotsTXT = true

[permalinks]
  gameengine = "/gameengine/:slug/"
  blog = "/blog/:slug/"

# Paperesque uses tags and categories. `series` groups the game engine posts.
[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[params]
  author = "Samrat Ghale"
  description = "Notes on game engines, graphics programming, and software."

  # Footnote margin notes are on by default.
  # With the wider column, floating notes can overflow on typical laptop
  # screens, so keep footnotes inline. Remove this to re-enable margin notes.
  disableMarginNotes = true

# Links in the top-right corner of every page.
[[params.topmenu]]
  name = "blog"
  url = "blog/"
  weight = 1

[[params.topmenu]]
  name = "series"
  url = "series/"
  weight = 2

[[params.topmenu]]
  name = "about"
  url = "about/"
  weight = 3

[[params.topmenu]]
  name = "rss"
  url = "index.xml"
  weight = 4

# Paperesque renders raw HTML in Markdown and ships a class-based syntax
# highlighting stylesheet (assets/css/syntax.css).
[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

# Keep processed images in the cache directory used by Cloudflare Workers.
[caches]
  [caches.images]
    dir = ':cacheDir/images'
