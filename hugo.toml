# Production URL of the site.
baseURL = "https://samratghale.com.np/"

theme = "black-and-light"

# Site metadata.
title = "Samrat Ghale"
author = "Samrat Ghale"
copyright = "© 2026 Samrat Ghale"
locale = "en-US"
defaultContentLanguage = "en"

enableRobotsTXT = true

[permalinks]
  gameengine = "/gameengine/:slug/"
  blog = "/blog/:slug/"

# Tags, categories, and the game engine series.
[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[params]
  sitename = "Samrat Ghale"
  description = "Notes on game engines, graphics programming, and software."
  dateform = "January 2, 2006"

  # Set to true to avoid loading Google Fonts.
  # disableWebFonts = true

# Header navigation.
[[menu.main]]
  name = "Game Engine"
  url = "/gameengine/"
  weight = 1

[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 2

[[menu.main]]
  name = "Series"
  url = "/series/"
  weight = 3

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 4

[[menu.main]]
  name = "RSS"
  url = "/index.xml"
  weight = 5

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = "bw"
    noClasses = true

# Keep processed images in the cache directory used by Cloudflare Workers.
[caches]
  [caches.images]
    dir = ':cacheDir/images'
