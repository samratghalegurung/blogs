{{ partial "header.html" . }}

<section id=content>
  <h1>{{ .Title }}</h1>

  {{ with .Content }}
  <div class="entry-content">{{ . }}</div>
  {{ end }}

  <ul class=posts_listing>
    {{ range .Pages.ByDate }}
      <li>
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        <div class=date>
          {{ if not .Date.IsZero }}
            {{ .Date.Format (.Site.Params.dateform | default "January 2006") }}
          {{ end }}
        </div>
      </li>
    {{ end }}
  </ul>
</section>

{{ partial "footer.html" . }}
